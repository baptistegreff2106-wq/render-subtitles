name: Assemble visual video (FFmpeg)
on:
  workflow_dispatch:
    inputs:
      output_name:
        description: 'Test MP4 name in Supabase Videos bucket'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: assemble-${{ inputs.output_name }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Assemble silent visual
        run: python3 scripts/assemble.py test-data/timeline.json visual.mp4
      - name: Upload visual MP4 to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${OUTPUT_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @visual.mp4 >/dev/null
