name: Assemble visual video (FFmpeg)
on:
  workflow_dispatch:
    inputs:
      timeline_json:
        description: 'Full JSON output from Build Timeline (shotstack_body or root body)'
        required: true
        type: string
      target_duration:
        description: 'Measured narration duration in seconds, including final fade (max 70); empty keeps source timing'
        required: false
        type: string
      output_name:
        description: 'Visual-only MP4 object name, e.g. acc_a_123_visual.mp4'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: assemble-${{ inputs.output_name }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Assemble silent visual
        env:
          TIMELINE_JSON: ${{ inputs.timeline_json }}
          TARGET_DURATION: ${{ inputs.target_duration }}
        run: |
          python3 -c 'import os, pathlib; pathlib.Path("timeline.json").write_text(os.environ["TIMELINE_JSON"], encoding="utf-8")'
          args=()
          if [[ -n "$TARGET_DURATION" ]]; then
            args+=(--target-duration "$TARGET_DURATION")
          fi
          python3 scripts/assemble.py timeline.json visual.mp4 "${args[@]}"
      - name: Upload visual MP4 to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${OUTPUT_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @visual.mp4 >/dev/null
